[project]
name = "jenn"
dynamic = ["version"]
authors = [{name = "Steven H. Berguin", email = "stevenberguin@gmail.com"}]
description = "Jacobian-Enhanced Neural Nets (JENN)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
]
dependencies = ["jsonpointer", "jsonschema", "orjson", "numpy", "matplotlib"]

[project.optional-dependencies]
# Pin below 2.0: mcp 2.x removed `mcp.server.fastmcp`, which server.py imports.
mcp = ["mcp>=1.2,<2"]

[project.scripts]
jenn-mcp = "jenn.mcp.server:main"

[project.urls]
Documentation = "https://shb84.github.io/JENN/"
Homepage = "https://github.com/shb84/JENN"
Issues = "https://github.com/shb84/JENN/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# setuptools ###################################################################
[tool.setuptools.dynamic]
version = {attr = "jenn.__version__"}

# mypy #########################################################################
[tool.mypy]
cache_dir = "build/.cache/mypy"
sqlite_cache = true
allow_redefinition = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
show_error_context = true
warn_return_any = false
warn_unused_ignores = true
disable_error_code = ["arg-type"]

# ruff #########################################################################
[tool.ruff]
target-version = "py39"
cache-dir = "build/.cache/ruff"
include = [
  "docs/**/*.py",
  # "docs/**/*.ipynb",
  "notebooks/**/*.ipynb",
  "src/**/*.py",
  "tests/**/*.py",
]
line-length = 88
preview = true

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN201",
  "ANN202",
  "ANN204",
  "ARG002",
  "B007",
  "C408",
  "COM812",
  "D104",
  "D107",
  "D203",
  "D205",
  "D211",
  "D213",
  "D401",
  "D404",
  "DOC201",
  "DOC501",
  "E501",
  "EM101",
  "EM102",
  "ERA001",
  "FBT001",
  "FBT002",
  "FBT003",
  "FIX002",
  "ISC001",
  "N803",
  "N806",
  "NPY002",
  "PD011",
  "PERF102",
  "PLR0913",
  "PLR0917",
  "PLR2004",
  "PLR6201",
  "PLR6301",
  "PLR0914",
  "PT028",
  "RET504",
  "RUF059",
  "T201",
  "TD002",
  "TD003",
  "TRY003",
]
flake8-copyright.notice-rgx = '''
\# Copyright \(C\) 2018 Steven H. Berguin
\# This work is licensed under the MIT License.
'''

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["CPY001"]
"docs/**/*.py" = ["INP001", "A001"]
"tests/*.py" = ["S101"]

[tool.docformatter]
# Module docstrings use an RST title + "====" underline as the summary.
# Summary wrapping would collapse those two lines into one (e.g.
# "Training. ============"), so disable it. Description wrapping and the
# other normalizations still apply.
wrap-summaries = 0
close-quotes-on-newline = true
