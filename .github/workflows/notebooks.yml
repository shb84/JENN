name: Notebooks
run-name: ${{ github.actor }} — notebooks

# Notebook tests are slow (they train models), so run them only when code
# lands on master (i.e. on merge), not on every branch push or pull request.
on:
  push:
    branches: [master]

jobs:
  test-nb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: dev
          pixi-version: v0.72.1
          cache: true
          cache-write: ${{ github.ref_name == 'master' }}

      - name: Run notebook tests
        run: pixi run -e dev test-nb
